# fly.toml app configuration file generated for pulse-gateway-dlee on 2026-04-28T17:19:59-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pulse-gateway-dlee'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/livez"

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
